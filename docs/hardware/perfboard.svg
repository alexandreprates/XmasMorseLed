<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<title>XmasMorseLed 2.0 perfboard placement guide</title><desc>Component placement and labeled net connections on isolated-pad perfboard. Use the wiring table for all connections; this is not a copper artwork.</desc>
<defs><pattern id="holes" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="3" fill="#c8ae81"/></pattern></defs>
<rect width="1200" height="820" fill="#fff"/><style>text{font:17px sans-serif;fill:#21353b}.small{font-size:14px}.title{font-size:27px;font-weight:bold}.part{fill:#fff;stroke:#364c52;stroke-width:2}.net{fill:none;stroke-width:4}.red{stroke:#bd3636}.blue{stroke:#26709b}.green{stroke:#38834e}.amber{stroke:#bc740b}</style>
<text x="35" y="42" class="title">Perfboard assembly • Top/component view</text><text x="35" y="72">Placement guide only. Each pad is isolated; wire the labeled nets from the wiring table.</text>
<rect x="40" y="130" width="860" height="590" rx="6" fill="#f4e5ca"/><rect x="40" y="130" width="860" height="590" fill="url(#holes)"/>
<rect x="80" y="450" width="230" height="275" fill="white"/><rect x="100" y="110" width="190" height="400" rx="8" fill="#21353b"/><rect x="146" y="87" width="96" height="55" fill="#bcc5ca" stroke="#364c52"/><text x="155" y="119">USB-C</text><text x="115" y="179" style="fill:white">SuperMini</text><text x="115" y="208" class="small" style="fill:white">Socket headers</text><text x="250" y="257" style="fill:white">5V</text><text x="233" y="302" style="fill:white">GND</text><text x="111" y="344" style="fill:white">GPIO0</text><text x="120" y="470" class="small" style="fill:white">Antenna: overhang</text><text x="120" y="492" class="small" style="fill:white">carrier edge</text>

<path d="M290 250H850M290 295H350V665H850" class="net red"/><path d="M290 295H350V665H850" class="net blue"/>

<path d="M100 337H70V550H380" class="net green"/><rect x="380" y="533" width="105" height="34" class="part"/><text x="390" y="555">R1 470 Ω</text><path d="M485 550H565" class="net green"/>
<rect x="565" y="495" width="135" height="110" class="part"/><text x="577" y="519">Q1 TO-92</text><text x="577" y="543">BC337</text><text x="572" y="574" class="small">B</text><text x="621" y="591" class="small">E</text><text x="678" y="574" class="small">C</text><path d="M630 605V665" class="net blue"/>
<path d="M525 550V605" class="net green"/><rect x="470" y="605" width="110" height="30" class="part"/><text x="480" y="626">R2 100 kΩ</text><path d="M525 635V665" class="net blue"/>
<path d="M700 563H810V430" class="net amber"/><rect x="745" y="365" width="130" height="65" class="part"/><text x="756" y="390">J1 TREE</text><text x="756" y="415">+         −</text><path d="M775 365V337" class="net red"/><rect x="716" y="302" width="130" height="35" class="part"/><text x="727" y="325">R3 56 Ω / ½ W</text><path d="M775 302V250" class="net red"/>
<rect x="465" y="350" width="128" height="35" class="part"/><text x="477" y="374">R4 220 Ω</text><path d="M490 350V250M530 385V417" class="net red"/><rect x="475" y="417" width="120" height="58" class="part"/><text x="487" y="440">J2 STAR</text><text x="487" y="462">+         −</text><path d="M590 455H715V665" class="net blue"/>
<rect x="385" y="270" width="135" height="58" class="part"/><text x="395" y="294">C1 100 nF</text><text x="395" y="315" class="small">5V ↔ GND</text><rect x="550" y="270" width="125" height="58" class="part"/><text x="560" y="294">C2 47 µF</text><text x="560" y="315" class="small">+5V / −GND</text>
<text x="925" y="178">Wire colors</text><path d="M930 210H970" class="net red"/><text x="982" y="215">5 V / LED +</text><path d="M930 252H970" class="net blue"/><text x="982" y="257">GND</text><path d="M930 294H970" class="net green"/><text x="982" y="299">Base signal</text><path d="M930 336H970" class="net amber"/><text x="982" y="341">Tree return</text>
<text x="925" y="407" class="small">Route crossing wires</text><text x="925" y="429" class="small">with insulation.</text><text x="925" y="466" class="small">Match transistor pins,</text><text x="925" y="488" class="small">not drawing positions.</text><text x="925" y="525" class="small">Keep antenna clear</text><text x="925" y="547" class="small">of metal and wiring.</text>
<text x="40" y="760">Board dimensions, header positions and transistor pin order must be checked against the physical parts.</text><text x="40" y="790" class="small">Read README.md in this directory before assembly. This conceptual placement is not a drilling template or a solder-side trace map.</text>
